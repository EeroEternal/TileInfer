[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tileinfer"
description = "A compatibility layer over vllm-ascend: declarations, decisions, contracts, providers and kernels"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "TileInfer contributors" }]
keywords = ["ascend", "npu", "attention", "llm", "serving", "tilelang"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

# The host side (interface, planning, reference backend) needs nothing but torch.
# Device-side kernels need torch_npu + the TileLang Ascend toolchain, which cannot be resolved
# from PyPI (the wheel is published as a GitHub release of tile-ai/tilelang-ascend) — see
# docs/architecture.md, "Environment".
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-timeout", "tabulate", "rich"]
npu = ["torch_npu"]
# The engine this package adapts.  Pinned to the 0.23 line: the bridge wraps 0.23's
# `CudagraphDispatcher` and vllm-ascend 0.23's platform hook, and `docs/notes/vllm-api-0.23.md`
# is the transcription they were checked against.
vllm = ["vllm>=0.23,<0.24"]

[project.scripts]
# `tileinfer doctor` checks the version triangle, the plan, the layered import rule, a dry
# bridge install and the last graph-counter snapshot, and exits non-zero on a hard failure —
# see tileinfer/cli/doctor.py.  `tileinfer plan build|show|verify` is the deploy-time interface;
# `tileinfer --help` lists both.  The script imports each command lazily.
tileinfer = "tileinfer.cli.main:main"

# v3 registers exactly one slot: the general plugin.  There is deliberately no
# `vllm.platform_plugins` entry: vllm-ascend owns the platform slot and a second claimant makes
# the process refuse to start (docs/integration.md §2).  vLLM loads general plugins in every
# process of a server (API server, EngineCore, workers); the bridge's `install()` is idempotent
# and never raises, so loading it everywhere is safe.
[project.entry-points."vllm.general_plugins"]
tileinfer = "tileinfer.bridge.install:install"

[project.urls]
Homepage = "https://github.com/EeroEternal/TileInfer"
Documentation = "https://github.com/EeroEternal/TileInfer/tree/main/docs"

[tool.setuptools.dynamic]
version = { attr = "tileinfer._version.__version__" }

[tool.setuptools.packages.find]
include = ["tileinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "npu: test requires an Ascend NPU",
  "tilelang: test requires the TileLang Ascend toolchain",
]

[tool.ruff]
line-length = 100
target-version = "py39"
