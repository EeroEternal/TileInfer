name: CI

# TileInfer's planning layer, reference backend and scheduler are deliberately device-free, so
# the majority of the suite runs on a plain runner.  Ascend-specific tests carry the `npu`
# marker and are skipped here; they run on the machine that has the 950.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install torch (CPU) and test deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-timeout
          pip install -e .

      - name: Run the device-free suite
        run: pytest tests -m "not npu" -q -p no:warnings

      - name: Smoke-test the public API on CPU
        run: python examples/quickstart.py --backend reference --device cpu
